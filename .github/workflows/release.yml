name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release asset
        run: |
          $tag = "${{ github.ref_name }}"
          $dist = "dist"
          $zipAsset = "owsvblocker-$tag-windows-x64.zip"
          $exeAsset = "owsvblocker-$tag-windows-x64.exe"

          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target\release\owsvblocker.exe" "$dist\owsvblocker.exe"
          Copy-Item "target\release\owsvblocker.exe" $exeAsset
          Compress-Archive -Path "$dist\owsvblocker.exe" -DestinationPath $zipAsset -Force

          "RELEASE_ZIP=$zipAsset" >> $env:GITHUB_ENV
          "RELEASE_EXE=$exeAsset" >> $env:GITHUB_ENV

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:RELEASE_ZIP" "$env:RELEASE_EXE" `
            --title "OW Server Blocker ${{ github.ref_name }}" `
            --generate-notes
