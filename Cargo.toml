[package]
name = "owsvblocker"
authors = ["EoKz"]
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.17.2", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
